<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>Internet Explorer</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

html,body{width:100%;height:100%;overflow:hidden;}

body{

  background:url('wallpaper.jpg') center/cover no-repeat;

  font-family:"宋体","SimSun","Tahoma","MS Sans Serif",sans-serif;

  font-size:16px;font-weight:bold;-webkit-font-smoothing:none;font-smooth:never;

  user-select:none;

}

.ie-win{

  position:fixed;top:12px;left:50%;transform:translateX(-50%);

  width:960px;height:680px;display:flex;flex-direction:column;

  background:#ece9d8;border:1px solid #0055dd;

  border-radius:8px 8px 0 0;box-shadow:2px 2px 12px rgba(0,0,0,0.4);

  overflow:hidden;

}

.ie-win .titlebar{

  height:28px;

  background:linear-gradient(to bottom,#0066ff,#0055dd 15%,#0044bb 50%,#003399);

  display:flex;align-items:center;padding:0 4px;flex-shrink:0;

}

.ie-win .title-text{

  flex:1;font-size:15px;font-weight:bold;color:#fff;padding-left:6px;

  font-family:"Tahoma","MS Sans Serif",sans-serif;text-shadow:0 1px 0 rgba(0,0,0,0.4);

}

.ie-win .tbtns{display:flex;gap:2px;margin-right:2px;}

.ie-win .tbtns button{

  width:24px;height:24px;

  border:1px solid;border-color:rgba(255,255,255,0.5) rgba(0,0,0,0.2) rgba(0,0,0,0.2) rgba(255,255,255,0.5);

  border-radius:3px;font-size:16px;font-weight:bold;

  display:flex;align-items:center;justify-content:center;

  cursor:pointer;padding:0;line-height:1;

  font-family:"Tahoma","MS Sans Serif",sans-serif;

  background:linear-gradient(to bottom,rgba(255,255,255,0.2),rgba(0,0,0,0.1));color:#000;

}

.ie-win .btn-close{background:linear-gradient(to bottom,#f08080,#c04040);color:#fff;}

.ie-win .menubar{

  height:24px;background:#ece9d8;display:flex;align-items:center;padding:0 3px;

  border-bottom:1px solid #c0c0c0;flex-shrink:0;

}

.ie-win .menubar span{font-size:16px;font-weight:bold;padding:2px 8px;cursor:pointer;color:#111;}

.ie-win .menubar span:hover{background:#1a3a8a;color:#fff;}



/* 导航工具栏 */

.navbar{

  height:30px;background:linear-gradient(to bottom,#f0ece0,#e0dcd0);

  display:flex;align-items:center;padding:0 4px;gap:2px;

  border-bottom:1px solid #c0c0c0;flex-shrink:0;

}

.navbar button{

  height:24px;min-width:24px;padding:0 4px;font-size:15px;font-weight:bold;

  background:linear-gradient(to bottom,#f8f4ec,#e0dcd0);

  border:1px solid #c0c0c0;border-color:#fff #888 #888 #fff;

  cursor:pointer;font-family:"Tahoma","MS Sans Serif",sans-serif;

}

.navbar button:hover{background:linear-gradient(to bottom,#fff,#e8e4d8);}

.navbar .sep{width:1px;height:20px;background:#c0c0c0;margin:0 2px;}

.navbar .addr-text{margin-left:4px;font-size:14px;font-weight:bold;color:#444;white-space:nowrap;}

.navbar .addr-box{

  flex:1;height:24px;background:#fff;

  border:1px solid #888;border-color:#888 #ccc #ccc #888;

  display:flex;align-items:center;padding:0 5px;margin:0 2px;

}

.navbar .addr-box input{

  flex:1;border:none;outline:none;font-size:16px;height:20px;

  font-family:"Tahoma","MS Sans Serif","宋体",sans-serif;background:transparent;

  -webkit-font-smoothing:none;font-smooth:never;

}

.navbar .go-btn{

  height:24px;padding:0 10px;font-size:15px;font-weight:bold;

  background:linear-gradient(to bottom,#f0f0f0,#d0d0d0);

  border:1px solid #888;border-color:#fff #888 #888 #fff;

  cursor:pointer;font-family:"Tahoma","MS Sans Serif",sans-serif;

}



/* 主体内容 */

.main-content{

  flex:1;background:#fff;overflow-y:auto;padding:0;

}



/* 搜索首页 */

.portal{

  display:flex;flex-direction:column;align-items:center;

  padding:40px 20px 20px;

}

.portal .logo-area{

  text-align:center;margin-bottom:20px;

}

.portal .logo-area .logo-text{

  font-family:"Arial Black",sans-serif;font-size:28px;color:#0055cc;

  text-shadow:1px 1px 0 #ccc;

}

.portal .logo-area .logo-sub{

  font-size:15px;color:#888;margin-top:2px;

}

.portal .search-row{

  display:flex;gap:0;width:520px;margin-bottom:25px;

  border:2px solid #aac;background:#fff;

}

.portal .search-row input{

  flex:1;height:30px;border:none;outline:none;padding:0 8px;

  font-size:15px;font-family:"宋体",sans-serif;

  -webkit-font-smoothing:none;font-smooth:never;

}

.portal .search-row button{

  width:70px;height:30px;

  background:linear-gradient(to bottom,#c8d8e8,#a0b8d0);

  border:none;border-left:1px solid #aac;

  cursor:pointer;font-size:16px;font-weight:bold;color:#fff;

  font-family:"Tahoma","MS Sans Serif",sans-serif;

}

.portal .search-row button:hover{background:linear-gradient(to bottom,#d0e0f0,#b0c8e0);}



/* 猜你想看 */

.guess-section{

  width:580px;margin:0 auto;

  border:1px solid #ddd;background:#fafaf8;

}

.guess-header{

  background:linear-gradient(to bottom,#e8e4d8,#dcd8cc);

  padding:5px 10px;font-size:16px;font-weight:bold;color:#444;

  border-bottom:1px solid #ddd;

}

.guess-body{

  padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;

}

.guess-item{

  padding:6px 8px;cursor:pointer;font-size:16px;color:#06c;

  border:1px solid transparent;border-radius:2px;

}

.guess-item:hover{background:#e8eef8;border-color:#c0d0e0;}

.guess-item .g-sub{font-size:14px;font-weight:bold;color:#888;margin-top:1px;}



/* 搜索结果页 */

.search-result{

  display:none;padding:15px 20px;

}

.result-item{

  margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #eee;

  cursor:pointer;

}

.result-item .r-title{

  font-size:16px;color:#06c;font-weight:bold;margin-bottom:2px;

}

.result-item .r-title:hover{text-decoration:underline;}

.result-item .r-url{font-size:14px;font-weight:bold;color:#090;}

.result-item .r-desc{font-size:16px;color:#444;margin-top:3px;line-height:1.5;}



/* 状态栏 */

.status{

  height:22px;background:#ece9d8;

  border-top:1px solid #c0c0c0;

  display:flex;align-items:center;padding:0 8px;flex-shrink:0;

}

.status .s-left{

  display:flex;align-items:center;gap:8px;font-size:15px;font-weight:bold;color:#444;

  font-family:"Tahoma","MS Sans Serif",sans-serif;

}

.status .s-right{margin-left:auto;font-size:14px;font-weight:bold;color:#888;}



.back-btn{

  position:fixed;top:6px;right:10px;z-index:9999;

  padding:5px 14px;font-size:16px;font-weight:bold;

  background:linear-gradient(to bottom,#f0f0f0,#d0d0d0);

  border:1px solid #888;border-color:#fff #888 #888 #fff;

  cursor:pointer;font-family:"Tahoma","MS Sans Serif",sans-serif;

}

.back-btn:hover{background:linear-gradient(to bottom,#fff,#e0e0e0);}


.ec-badge{position:fixed;top:10px;right:12px;z-index:100000;background:rgba(45,45,55,0.55);border:1px solid rgba(90,90,100,0.4);border-radius:4px;padding:2px 8px;font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-size:13px;color:#d0c8b8;box-shadow:1px 1px 4px rgba(0,0,0,0.2);letter-spacing:1px;backdrop-filter:blur(2px);pointer-events:none;}
.ec-badge .ec-n{color:#f0d878;font-weight:bold;font-size:15px;}
.ec-badge .ec-t{color:#b0a898;}
</style>

</head>

<body>

<div class="ie-win">

          <div class="guess-item" onclick="showNews6()">

            <span style="color:#c00;">&#9654;</span> 多地建立救助庇护所

            <div class="g-sub">为受困群体提供临时避风港</div>

          </div>

        </div>

      </div>

    </div>



    <!-- 搜索结果页 -->

    <div id="resultPage" class="search-result"></div>
    <div id="newsPage" style="display:none;padding:20px 30px;overflow-y:auto;height:100%;"></div>
  </div>



  <div class="status">

    <div class="s-left">

      <span id="statusIcon">&#9673;</span>

      <span id="statusText">完成</span>

    </div>

    <div class="s-right" id="statusRight">Internet</div>

  </div>

</div>




<script>

var searchHistory = [];



function doSearch() {

  var q = document.getElementById('searchInput').value.trim();

  if (!q || !keywordDB[q]) return;

  searchHistory.push(q);

  document.getElementById('addrInput').value = 'http://www.haohua.com/search?q=' + encodeURIComponent(q);

  showResults(q);

}



function doSearchKeyword(keyword) {

  document.getElementById('searchInput').value = keyword;

  searchHistory.push(keyword);

  document.getElementById('addrInput').value = 'http://www.haohua.com/search?q=' + encodeURIComponent(keyword);

  showResults(keyword);

}



function showResults(keyword) {

  document.getElementById('portalPage').style.display = 'none';

  var rp = document.getElementById('resultPage');

  rp.style.display = 'block';

  

  // Find matching results

  var results = [];
  // Handle 槐理十佳歌手 - show multiple results with pagination
  if(keyword === '槐理十佳歌手'){
    showSingerPage(1);
    return;
  }
  

  for (var key in keywordDB) {

    if (key === keyword) {

      results.push({key: key, data: keywordDB[key], match: 1});

    }

  }


  

  if (results.length === 0) {

    rp.innerHTML = '<div style="padding:30px;text-align:center;color:#999;font-size:15px;">未找到与"<b>' + keyword + '</b>"相关的结果。</div>';

  } else {

    var html = '<div style="margin-bottom:10px;font-size:16px;color:#666;">搜索 "<b>' + keyword + '</b>" 共找到 ' + results.length + ' 条结果</div>';

    for (var i = 0; i < results.length; i++) {

      var r = results[i];

      html += '<div class="result-item" onclick="window.open(\'' + r.data.url + '\', \'_blank\')">';

      html += '<div class="r-title">' + r.data.title + '</div>';

      html += '<div class="r-url">' + r.data.url + '</div>';

      html += '<div class="r-desc">' + r.data.desc + '</div>';

      html += '</div>';

    }

    // Add navigation hint

    if (results.length === 1 && results[0].match === 1) {

      html += '<div style="margin-top:10px;padding:10px;background:#f8f6f0;border:1px solid #ddd;font-size:16px;color:#666;">点击结果进入相关页面。</div>';

    }

    rp.innerHTML = html;

  }

  

  document.getElementById('statusText').textContent = '已返回搜索 (' + results.length + ' 条结果)';

  document.getElementById('winTitle').textContent = '搜索结果 - ' + keyword + ' - Internet Explorer';

}



function navigateTo(url) {

  if (url === 'about:blank' || url === '' || url === 'about:blank') {

    goHome();

    return;

  }

  // Extract search query from URL

  var qMatch = url.match(/[?&]q=([^&]+)/);

  if (qMatch) {

    var q = decodeURIComponent(qMatch[1]);

    document.getElementById('searchInput').value = q;

    showResults(q);

  }

}



function goHome() {

  document.getElementById('portalPage').style.display = 'flex';

  document.getElementById('resultPage').style.display = 'none';

  document.getElementById('addrInput').value = 'about:blank';

  document.getElementById('statusText').textContent = '完成';

  document.getElementById('winTitle').textContent = 'Internet Explorer';

  document.getElementById('searchInput').value = '';

}



function goBack() {

  if (searchHistory.length > 1) {

    searchHistory.pop();

    showResults(searchHistory[searchHistory.length - 1]);

  }

}



function goForward() {

  // Simplified - just goes back to home

  goHome();

}
