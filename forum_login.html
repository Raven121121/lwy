<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>槐花论坛 - 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#e8e4dc;font-family:"宋体","SimSun",sans-serif;
  font-size:15px;font-weight:900;-webkit-font-smoothing:none;color:#333;
}
.win{
  width:520px;margin:80px auto;background:#fff;
  border:2px solid #999;border-color:#fff #666 #666 #fff;
  box-shadow:2px 2px 12px rgba(0,0,0,0.2);
}
.titlebar{
  height:30px;background:linear-gradient(90deg,#0a246a,#3a6ea5,#0a246a);
  display:flex;align-items:center;padding:0 10px;
  color:#fff;font-size:15px;text-shadow:1px 1px 0 #000;
}
.titlebar .close{
  margin-left:auto;width:22px;height:20px;
  background:linear-gradient(to bottom,#f0a0a0,#c04040);
  border:1px solid #d06060 #802020 #802020 #d06060;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;cursor:pointer;font-weight:900;
}
.body{padding:28px 32px;}

.step{display:block;}
.step.hide{display:none;}

.step h2{font-size:18px;font-weight:900;color:#222;margin-bottom:8px;}
.step .note{font-size:14px;color:#888;margin-bottom:16px;font-weight:900;}
.step label{font-size:15px;font-weight:900;color:#444;display:block;margin-bottom:5px;}
.step input{
  width:100%;height:36px;border:2px solid #999;
  border-color:#666 #fff #fff #666;padding:0 12px;font-size:15px;
  font-family:"宋体",sans-serif;outline:none;background:#fff;font-weight:900;
  margin-bottom:14px;
}
.step input:focus{border-color:#4a8ad0;}
.step .hint{font-size:12px;color:#bbb;margin-top:-12px;margin-bottom:12px;font-weight:900;}
.step .btn{
  padding:6px 28px;font-size:14px;font-weight:900;
  background:linear-gradient(to bottom,#f0f0e8,#d0d0c8);
  border:2px solid #888;border-color:#fff #666 #666 #fff;
  cursor:pointer;font-family:"宋体",sans-serif;
}
.step .btn:active{border-color:#666 #fff #fff #666;}
.step .err{color:#c00;font-size:14px;font-weight:900;margin-top:8px;display:none;}

/* 加载动画 */
.loading-bar{
  width:100%;height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:16px 0;
}
.loading-bar .fill{
  height:100%;width:0%;background:linear-gradient(to right,#3a6ea5,#6aaae8);
  border-radius:3px;transition:width 0.3s;
}

.security-notice{
  background:#fff8e0;border:1px solid #e8d080;padding:16px 20px;margin:14px 0;
  line-height:1.8;font-size:14px;font-weight:900;color:#553;
}
.security-notice .sn-title{font-size:15px;color:#c60;margin-bottom:6px;font-weight:900;}

.success-msg{color:#060;font-size:15px;font-weight:900;margin-top:10px;display:none;text-align:center;}

.back-btn{
  position:fixed;top:12px;right:16px;z-index:9999;
  padding:4px 14px;font-size:13px;font-weight:900;
  background:linear-gradient(to bottom,#f0f0e8,#d0d0c8);
  border:2px solid #888;border-color:#fff #666 #666 #fff;
  cursor:pointer;font-family:"宋体","SimSun",sans-serif;
}

.ec-badge{position:fixed;top:10px;right:12px;z-index:100000;background:rgba(45,45,55,0.55);border:1px solid rgba(90,90,100,0.4);border-radius:4px;padding:2px 8px;font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-size:13px;color:#d0c8b8;box-shadow:1px 1px 4px rgba(0,0,0,0.2);letter-spacing:1px;backdrop-filter:blur(2px);pointer-events:none;}
.ec-badge .ec-n{color:#f0d878;font-weight:bold;font-size:15px;}
.ec-badge .ec-t{color:#b0a898;}
</style>
</head>
<body>
<div class="win">
<div class="titlebar">
  <span>槐花论坛 - 用户登录</span>
  <span class="close" onclick="window.close()">&#10005;</span>
</div>
<div class="body">

<!-- Step 1: Login -->
<div class="step" id="step1">
  <h2>用户登录</h2>
  <div class="note">欢迎回到槐花论坛</div>
  <label>账号</label>
  <input type="text" id="accountInput" placeholder="请输入账号" onkeydown="if(event.key==='Enter')doLogin()">
  <label>密码</label>
  <input type="password" id="pwdInput" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
  <div class="hint">提示：无大写字母</div>
  <button class="btn" onclick="doLogin()">登录</button>
  <div class="err" id="loginErr">账号或密码错误，请重新输入</div>
</div>

<!-- Step 2: Loading + Security Notice -->
<div class="step hide" id="step2">
  <h2>正在登录...</h2>
  <div class="loading-bar"><div class="fill" id="loadFill"></div></div>
  <div id="loadText" style="font-size:13px;color:#888;font-weight:900;">正在验证账号信息...</div>
</div>

<!-- Step 3: Security Prompt -->
<div class="step hide" id="step3">
  <div class="security-notice">
    <div class="sn-title">⚠️ 安全验证</div>
    由于您长时间未登录该账号，为保障您的账号安全，请先回答您设置的密保问题。
  </div>
  <button class="btn" onclick="startSecurity()">确定，开始验证</button>
</div>

<!-- Step 4: Security Questions -->
<div class="step hide" id="step4">
  <h2>密保验证</h2>
  <div class="note">请回答以下问题以验证身份</div>
  
  <label>歌词 ?</label>
    <input type="text" id="q2Input" placeholder="" onkeydown="if(event.key==='Enter')checkQ2()">
    <div class="hint">提示：首字母</div>
    <button class="btn" onclick="checkQ2()">验证</button>
    <div class="err" id="q2Err">答案错误，请重新输入</div>
  
  <div class="success-msg" id="verifySuccess">✅ 验证通过！正在进入槐花论坛...</div>
</div>

</div>
</div>

<button class="back-btn" onclick="window.close()">&#9664; 关闭</button>

<script>
function doLogin(){
  var acc = document.getElementById('accountInput').value.trim();
  var pwd = document.getElementById('pwdInput').value.trim().toLowerCase();
  if(acc === '111' && pwd === '111'){
    window.location.href='forum_main.html';
    return;
  }
  if(acc === '1826701288' && pwd === 'xiaowangzi'){
    document.getElementById('step1').className = 'step hide';
    document.getElementById('step2').className = 'step';
    document.getElementById('loginErr').style.display = 'none';
    // Simulate loading
    var fill = document.getElementById('loadFill');
    var text = document.getElementById('loadText');
    var w = 0;
    var t = setInterval(function(){
      w += 8;
      fill.style.width = w + '%';
      if(w === 40) text.textContent = '正在验证身份信息...';
      if(w === 70) text.textContent = '检测到账号异常登录状态...';
      if(w >= 100){
        clearInterval(t);
        text.textContent = '登录受限';
        document.getElementById('step2').className = 'step hide';
        document.getElementById('step3').className = 'step';
      }
    }, 200);
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}
function startSecurity(){
  document.getElementById('step3').className = 'step hide';
  document.getElementById('step4').className = 'step';
}
function checkQ2(){
  var a = document.getElementById('q2Input').value.trim().toLowerCase().replace(/\s/g,'');
  if(a === 'xxaytdgyy'){
    document.getElementById('q2Err').style.display = 'none';
    document.getElementById('verifySuccess').style.display = 'block';
    setTimeout(function(){ window.location.href='forum_main.html'; }, 1500);
  } else {
    document.getElementById('q2Err').style.display = 'block';
  }
}
</script>
<div class="ec-badge" id="ecBadge"><span class="ec-n">23</span><span class="ec-t">/29</span></div>

</body>
</html>
