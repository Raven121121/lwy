<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Outlook Express</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:url('wallpaper.jpg') center/cover no-repeat;
  font-family:"宋体","SimSun","Tahoma","MS Sans Serif",sans-serif;
  font-size:18px;-webkit-font-smoothing:none;font-smooth:never;
  user-select:none;
}
.xp-win{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  width:780px;height:620px;display:flex;flex-direction:column;
  background:#ece9d8;border:1px solid #0055dd;
  border-radius:8px 8px 0 0;box-shadow:2px 2px 12px rgba(0,0,0,0.4);
  overflow:hidden;
}
.xp-win .titlebar{
  height:28px;
  background:linear-gradient(to bottom,#0066ff,#0055dd 15%,#0044bb 50%,#003399);
  display:flex;align-items:center;padding:0 4px;flex-shrink:0;
}
.xp-win .title-text{
  flex:1;font-size:16px;font-weight:bold;color:#fff;padding-left:6px;
  font-family:"Tahoma","MS Sans Serif",sans-serif;text-shadow:0 1px 0 rgba(0,0,0,0.4);
}
.xp-win .tbtns{display:flex;gap:2px;margin-right:2px;}
.xp-win .tbtns button{
  width:24px;height:24px;
  border:1px solid;border-color:rgba(255,255,255,0.5) rgba(0,0,0,0.2) rgba(0,0,0,0.2) rgba(255,255,255,0.5);
  border-radius:3px;font-size:16px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;line-height:1;
  font-family:"Tahoma","MS Sans Serif",sans-serif;
  background:linear-gradient(to bottom,rgba(255,255,255,0.2),rgba(0,0,0,0.1));color:#000;
}
.xp-win .btn-close{background:linear-gradient(to bottom,#f08080,#c04040);color:#fff;}
.xp-win .menubar{
  height:22px;background:#ece9d8;display:flex;align-items:center;padding:0 3px;
  border-bottom:1px solid #c0c0c0;flex-shrink:0;
}
.xp-win .menubar span{font-size:17px;font-weight:bold;padding:2px 8px;cursor:pointer;color:#111;}
.xp-win .menubar span:hover{background:#1a3a8a;color:#fff;}

/* XP 工具栏 */
.toolbar{
  height:26px;background:linear-gradient(to bottom,#f0ece0,#e0dcd0);
  display:flex;align-items:center;padding:0 4px;gap:2px;
  border-bottom:1px solid #c0c0c0;flex-shrink:0;
}
.toolbar button{
  height:24px;padding:0 8px;font-size:16px;font-weight:bold;
  background:linear-gradient(to bottom,#f8f4ec,#e0dcd0);
  border:1px solid #c0c0c0;border-color:#fff #888 #888 #fff;
  cursor:pointer;font-family:"宋体",sans-serif;
  white-space:nowrap;
}
.toolbar button:hover{background:linear-gradient(to bottom,#fff,#e8e4d8);}
.toolbar .sep{width:1px;height:18px;background:#c0c0c0;margin:0 2px;}

/* 主体: 双栏布局 */
.main-body{
  flex:1;display:flex;overflow:hidden;
  margin:0;border:0;
}

/* 左侧文件夹面板 */
.folder-panel{
  width:130px;background:#ece9d8;
  border-right:1px solid #c0c0c0;
  padding:4px 0;overflow-y:auto;
  flex-shrink:0;
}
.folder{
  padding:5px 10px;cursor:pointer;font-size:17px;font-weight:bold;
  display:flex;align-items:center;gap:4px;color:#222;
}
.folder:hover{background:#d0d8e8;}
.folder.sel{background:#1a3a8a;color:#fff;}
.folder.disabled{cursor:default;}
.folder.disabled:hover{background:transparent;}
.folder.disabled .f-icon{opacity:0.3;}

/* 右侧内容区 */
.content-panel{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:#fff;
}
/* 邮件列表表头 */
.list-header{
  display:grid;
  grid-template-columns:30px 1fr 120px 100px;
  background:linear-gradient(to bottom,#f0ece0,#e0dcd0);
  border-bottom:1px solid #c0c0c0;
  padding:4px 6px;font-size:16px;font-weight:bold;color:#444;
  flex-shrink:0;
}
/* 邮件列表 */
.email-list{
  flex:1;overflow-y:auto;background:#fff;
}
.email-item{
  display:grid;grid-template-columns:30px 1fr 120px 100px;
  padding:4px 6px;cursor:pointer;
  font-size:16px;color:#333;
  border-bottom:1px solid #eee;
}
.email-item:hover{background:#e8eef8;}
.email-item .from{font-weight:bold;}
.email-item .subj{color:#555;}
.email-item .date{color:#888;text-align:right;font-family:"Tahoma",sans-serif;}
.email-item .attach{text-align:center;color:#aaa;font-size:18px;}


/* 邮件正文区 */
.email-body{
  flex:1;overflow-y:auto;max-height:320px;padding:14px 18px;
  background:#f8f6f0;border-top:1px solid #ddd;
  font-size:18px;line-height:2.0;display:none;
}
.email-body .ehdr{
  margin-bottom:8px;padding-bottom:8px;
  border-bottom:1px dashed #ccc;
  font-size:18px;color:#666;
}
.email-body .ehdr span{color:#333;}

/* 状态栏 */
.status{
  height:20px;background:#ece9d8;
  border-top:1px solid #c0c0c0;
  display:flex;align-items:center;padding:0 6px;
  font-size:16px;font-weight:bold;color:#444;flex-shrink:0;
  font-family:"Tahoma","MS Sans Serif",sans-serif;
}

.back-btn{
  position:fixed;top:6px;right:10px;z-index:9999;
  padding:5px 14px;font-size:16px;font-weight:bold;
  background:linear-gradient(to bottom,#f0f0f0,#d0d0d0);
  border:1px solid #888;border-color:#fff #888 #888 #fff;
  cursor:pointer;font-family:"Tahoma","MS Sans Serif",sans-serif;
}
.back-btn:hover{background:linear-gradient(to bottom,#fff,#e0e0e0);}

.ec-badge{position:fixed;top:10px;right:12px;z-index:100000;background:rgba(45,45,55,0.55);border:1px solid rgba(90,90,100,0.4);border-radius:4px;padding:2px 8px;font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-size:13px;color:#d0c8b8;box-shadow:1px 1px 4px rgba(0,0,0,0.2);letter-spacing:1px;backdrop-filter:blur(2px);pointer-events:none;}
.ec-badge .ec-n{color:#f0d878;font-weight:bold;font-size:15px;}
.ec-badge .ec-t{color:#b0a898;}
</style>
</head>
<body>
<div class="xp-win">
  <div class="titlebar">
    <span class="title-text" id="winTitle">Outlook Express &#8212; 收件箱</span>
    <div class="tbtns">
      <button class="btn-close" onclick="window.location.href='desktop.html'">&#10005;</button>
    </div>
  </div>
  <div class="menubar">
    <span>文件(F)</span><span>编辑(E)</span><span>查看(V)</span>
    <span>工具(T)</span><span>邮件(M)</span><span>帮助(H)</span>
  </div>
  <div class="toolbar">
    <button>新建</button>
    <button onclick="replyEmail()">回复</button>
    <button>全部回复</button>
    <button>转发</button>
    <span class="sep"></span>
    <button>打印</button>
    <button>删除</button>
    <span class="sep"></span>
    <button id="btnPrev">上一封</button>
    <button id="btnNext">下一封</button>
  </div>
  <div class="main-body">
    <!-- 左侧文件夹 -->
    <div class="folder-panel">
      <div class="folder sel" onclick="showFolder('inbox')"><span style="color:#c08020;">&#9922;</span> 收件箱</div>
      <div class="folder" onclick="showFolder('sent')"><span style="color:#6080c0;">&#9921;</span> 已发送</div>
      <div class="folder" onclick="showFolder('drafts')"><span style="color:#c0a060;">&#9999;</span> 草稿箱</div>
      <div class="folder disabled"><span style="color:#888;">&#9776;</span> 垃圾箱</div>
      <div class="folder disabled"><span style="color:#888;">&#9733;</span> 星标邮件</div>
      
    </div>
    <!-- 右侧内容 -->
    <div class="content-panel">
      <!-- 这个区域会被 JS 动态填充 -->
      <div id="contentArea" style="flex:1;display:flex;flex-direction:column;"></div>
    </div>
  </div>
  <div class="status" id="statusBar"><span>收件箱: 7 封邮件</span></div>
</div>

var currentFolder = 'inbox';
var currentEmailIdx = -1;

function showFolder(folder) {
  currentFolder = folder;
  // 更新文件夹选中状态
  document.querySelectorAll('.folder').forEach(function(el){
    el.classList.remove('sel');
  });
  var folders = document.querySelectorAll('.folder');
  var idxMap = {inbox:0, sent:1, drafts:2};
  if (idxMap[folder] !== undefined) folders[idxMap[folder]].classList.add('sel');
  
  var titleMap = {inbox:'收件箱', sent:'已发送', drafts:'草稿箱'};
  document.getElementById('winTitle').innerHTML = 'Outlook Express &#8212; ' + titleMap[folder];
  
  var countMap = {inbox:'收件箱: 7 封邮件', sent:'已发送: 1 封邮件', drafts:'草稿箱: 1 封邮件'};
  document.getElementById('statusBar').innerHTML = '<span>' + (countMap[folder] || '') + '</span>';
  
  renderEmailList(folder);
  currentEmailIdx = -1;
}

function renderEmailList(folder) {
  var area = document.getElementById('contentArea');
  var data = emails[folder];
  if (!data || data.length === 0) {
    area.innerHTML = '<div style="padding:20px;text-align:center;color:#999;font-size:16px;">暂无邮件</div>';
    return;
  }
  
  // 表头
  var html = '<div class="list-header">';
  html += '<span></span><span>发件人</span><span>主题</span><span>时间</span>';
  html += '</div>';
  
  // 邮件列表
  html += '<div class="email-list">';
  for (var i = 0; i < data.length; i++) {
    var e = data[i];
    var cls = 'email-item';
    var star = '&#9733;';
    html += '<div class="' + cls + '" onclick="openEmail(' + i + ')">';
    html += '<span class="attach">' + star + '</span>';
    html += '<span class="from">' + e.from + '</span>';
    html += '<span class="subj">' + e.subj + '</span>';
    html += '<span class="date">' + e.date.split(' ')[0] + '</span>';
    html += '</div>';
  }
  html += '</div>';
  
  // 正文区（隐藏）
  html += '<div class="email-body" id="emailBody"></div>';
  
  area.innerHTML = html;
}

function openEmail(idx) {
  var data = emails[currentFolder];
  if (!data || idx >= data.length) return;
  var e = data[idx];
  currentEmailIdx = idx;
  
  // 高亮当前邮件
  var items = document.querySelectorAll('.email-item');
  items.forEach(function(el){el.style.background='';});
  if (items[idx]) items[idx].style.background='#c0d8f0';
  
  // 显示正文
  var body = document.getElementById('emailBody');
  body.style.display = 'block';
  var lst=document.querySelector('.email-list');if(lst)lst.style.maxHeight='120px';
  
  var toLine = e.to ? '收件人：<span style="color:#06c;">' + e.to + ' &lt;' + e.toAddr + '&gt;</span><br>' : '';
  var fromLine = '发件人：<span style="color:#06c;">' + e.from + ' &lt;' + e.fromAddr + '&gt;</span><br>';
  
  body.innerHTML = '<div class="ehdr">' +
    fromLine +
    toLine +
    '主题：<span style="color:#333;">' + e.subj + '</span><br>' +
    '时间：<span>' + e.date + '</span>' +
    '</div>' +
    '<div>' + e.body + '</div>';
}

function replyEmail() {
  if (currentEmailIdx < 0) return;
  var data = emails[currentFolder];
  if (!data || currentEmailIdx >= data.length) return;
  var e = data[currentFolder === 'drafts' ? currentEmailIdx : currentEmailIdx];
  alert('回复功能：\n收件人：' + e.from + '\n\n（功能尚未实现，敬请期待）');
}

// 默认显示收件箱
showFolder('inbox');
