<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>QQ音乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;}
body{
  background:url('assets/images/wallpaper.jpg') center/cover no-repeat;
  font-family:"宋体","SimSun",sans-serif;
  font-size:12px;font-weight:900;-webkit-font-smoothing:none;font-smooth:never;
  user-select:none;
}
.win{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:680px;height:500px;
  background:#f0ede7;
  border:2px solid #888;border-color:#fff #666 #666 #fff;
  box-shadow:2px 2px 12px rgba(0,0,0,0.3);
  display:flex;flex-direction:column;
}
.titlebar{
  height:30px;
  background:linear-gradient(90deg,#0a246a,#3a6ea5,#0a246a);
  display:flex;align-items:center;padding:0 8px;cursor:move;
}
.titlebar .tb-text{
  font-size:14px;color:#fff;font-weight:900;
  font-family:"宋体",sans-serif;text-shadow:1px 1px 0 #000;
}
.titlebar .close{
  margin-left:auto;width:22px;height:20px;
  background:linear-gradient(to bottom,#f0a0a0,#c04040);
  border:1px solid #d06060 #802020 #802020 #d06060;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;font-weight:900;cursor:pointer;
}
.body{flex:1;display:flex;flex-direction:column;padding:6px;gap:6px;overflow:hidden;}
.now-bar{
  height:60px;background:linear-gradient(to bottom,#f8f8f0,#e8e5dd);
  border:1px solid #c0bfb8;display:flex;align-items:center;padding:0 12px;gap:12px;
}
.now-bar .nb-cover{
  width:48px;height:48px;background:linear-gradient(135deg,#b0c8e0,#8090b0);
  border:1px solid #999;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:#fff;flex-shrink:0;
}
.now-bar .nb-info{flex:1;}
.now-bar .nb-info .nb-name{font-size:15px;font-weight:900;color:#222;}
.now-bar .nb-info .nb-artist{font-size:12px;font-weight:900;color:#666;}
.now-bar .nb-progress{width:200px;}
.now-bar .nb-progress .pr-bar{
  height:4px;background:#ddd;border-radius:2px;overflow:hidden;margin-bottom:4px;
}
.now-bar .nb-progress .pr-bar .pr-fill{
  height:100%;width:0%;background:linear-gradient(to right,#4a8ad0,#6aaae8);border-radius:2px;
}
.now-bar .nb-progress .pr-time{font-size:11px;color:#888;font-weight:900;text-align:right;}
.now-bar .nb-btns{display:flex;gap:4px;}
.now-bar .nb-btns .pbtn{
  width:28px;height:26px;
  background:linear-gradient(to bottom,#f0f0e8,#d0d0c8);
  border:2px solid #888;border-color:#fff #666 #666 #fff;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#444;cursor:pointer;font-weight:900;
}
.now-bar .nb-btns .pbtn:active{border-color:#666 #fff #fff #666;}
.now-bar .nb-btns .pbtn.play{color:#2a6a2a;background:linear-gradient(to bottom,#d0e8d0,#b0d0b0);}
.mid{flex:1;display:flex;gap:6px;overflow:hidden;}
.playlist{
  width:200px;background:#fff;border:1px solid #c0bfb8;
  display:flex;flex-direction:column;flex-shrink:0;
}
.playlist .pl-hd{
  height:26px;background:linear-gradient(to bottom,#e8e5dd,#ddd9d0);
  border-bottom:1px solid #c0bfb8;display:flex;align-items:center;padding:0 8px;
  font-size:13px;font-weight:900;color:#333;
}
.playlist .pl-list{flex:1;overflow-y:auto;}
.playlist .pl-item{
  padding:5px 8px;font-size:13px;font-weight:900;color:#333;
  cursor:pointer;border-bottom:1px solid #f0efe8;
  display:flex;align-items:center;gap:6px;
}
.playlist .pl-item:hover{background:#d8e8f8;}
.playlist .pl-item.active{background:#b4d8f8;}
.playlist .pl-item .pl-num{color:#999;width:22px;font-weight:900;}
.playlist .pl-item .pl-name{flex:1;}
.playlist .pl-item .pl-artist{font-size:11px;color:#888;font-weight:900;}
.lyrics{
  flex:1;background:#fff;border:1px solid #c0bfb8;
  padding:10px;overflow-y:auto;
}
.lyrics .l-title{
  font-size:16px;font-weight:900;color:#222;margin-bottom:8px;padding-bottom:6px;
  border-bottom:1px solid #e0ddd5;
}
.lyrics .l-line{
  font-size:13px;font-weight:900;color:#555;padding:3px 6px;line-height:1.7;
  font-family:"宋体","SimSun",sans-serif;
}
.lyrics .l-line .l-time{color:#aaa;margin-right:8px;font-weight:900;}
.lyrics .l-line.active{background:#e0edf8;color:#1a5a8a;border-radius:2px;}
.lyrics .l-line.active .l-time{color:#4a8ad0;}
.lyrics .l-note{font-size:11px;color:#aaa;font-weight:900;margin-top:8px;text-align:center;}
.back-btn{
  position:fixed;top:8px;right:12px;z-index:9999;
  padding:3px 12px;font-size:12px;font-weight:900;
  background:linear-gradient(to bottom,#f0f0e8,#d0d0c8);
  border:2px solid #888;border-color:#fff #666 #666 #fff;
  cursor:pointer;font-family:"宋体","SimSun",sans-serif;
}
.back-btn:active{border-color:#666 #fff #fff #666;}

.ec-badge{position:fixed;top:10px;right:12px;z-index:100000;background:rgba(45,45,55,0.55);border:1px solid rgba(90,90,100,0.4);border-radius:4px;padding:2px 8px;font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-size:13px;color:#d0c8b8;box-shadow:1px 1px 4px rgba(0,0,0,0.2);letter-spacing:1px;backdrop-filter:blur(2px);pointer-events:none;}
.ec-badge .ec-n{color:#f0d878;font-weight:bold;font-size:15px;}
.ec-badge .ec-t{color:#b0a898;}
</style>
</head>
<body>
<div class="win" id="playerWin">

        <div class="pr-time" id="nowTime">00:00 / 04:25</div>
      </div>
      <div class="nb-btns">
        <span class="pbtn" onclick="prevSong()">&#9664;&#9664;</span>
        <span class="pbtn play" id="playBtn" onclick="togglePlay()">&#9654;</span>
        <span class="pbtn" onclick="nextSong()">&#9654;&#9654;</span>

    </div>
    <div class="mid">

        <div class="pl-list" id="playlistEl"></div>
      </div>
      <div class="lyrics" id="lyricsEl"></div>
    </div>
  </div>
</div>

var cur = 0, playing = false, timer = null, lineIdx = 0;

function renderList(){
  var el = document.getElementById('playlistEl');
  el.innerHTML = '';
  for(var i=0;i<songs.length;i++){
    var s = songs[i];
    var d = document.createElement('div');
    d.className = 'pl-item' + (i===cur?' active':'');
    d.innerHTML = '<span class="pl-num">'+(i+1)+'.</span><span class="pl-name">'+s.name+'</span><span class="pl-artist">'+s.artist+'</span>';
    d.onclick = (function(idx){ return function(){ play(idx); }; })(i);
    el.appendChild(d);
  }
}
function renderLyrics(){
  var el = document.getElementById('lyricsEl');
  var s = songs[cur];
  var html = '<div class="l-title">' + s.name + ' - ' + s.artist + '</div>';
  for(var i=0;i<s.lyrics.length;i++){
    html += '<div class="l-line" data-idx="'+i+'"><span class="l-time">['+s.lyrics[i].t+']</span>'+s.lyrics[i].txt+'</div>';
  }
  html += '<div class="l-note">共 ' + s.lyrics.length + ' 行歌词</div>';
  el.innerHTML = html;
}
function play(idx){
  cur = idx;
  var s = songs[idx];
  document.getElementById('nowName').textContent = s.name;
  document.getElementById('nowArtist').textContent = s.artist;
  document.getElementById('nowTime').textContent = '00:00 / ' + s.duration;
  document.getElementById('prFill').style.width = '0%';
  playing = true;
  document.getElementById('playBtn').textContent = '⏸';
  renderList();
  renderLyrics();
  if(timer) clearInterval(timer);
  lineIdx = 0;
  timer = setInterval(function(){
    var lyr = songs[cur].lyrics;
    if(lineIdx < lyr.length){
      var lines = document.querySelectorAll('.l-line');
      for(var i=0;i<lines.length;i++) lines[i].classList.remove('active');
      if(lines[lineIdx]) lines[lineIdx].classList.add('active');
      lineIdx++;
    } else { clearInterval(timer); }
  }, 2000);
}
function togglePlay(){
  if(playing){playing=false;clearInterval(timer);document.getElementById('playBtn').textContent='▶';}
  else{play(cur);}
}
function nextSong(){play((cur+1)%songs.length);}
function prevSong(){play((cur-1+songs.length)%songs.length);}
renderList();
play(0);
(function(){
  var drag=false,ox,oy,mx,my,win=document.getElementById('playerWin'),bar=document.getElementById('playerTitlebar');
  bar.onmousedown=function(e){
    drag=true;ox=e.clientX;oy=e.clientY;
    mx=parseInt(win.style.left)||(window.innerWidth-680)/2;
    my=parseInt(win.style.top)||(window.innerHeight-500)/2;
    document.onmousemove=function(ev){if(!drag)return;win.style.left=(mx+ev.clientX-ox)+'px';win.style.top=(my+ev.clientY-oy)+'px';};
    document.onmouseup=function(){drag=false;};
    e.preventDefault();
  };
})();
</script>
